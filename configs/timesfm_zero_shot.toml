# Experiment A: frozen settings for the TimesFM zero-shot comparator.
# This arm must remain case-history-only: do not add weather, calendar, district
# labels, fitting, or tuning inputs here.
arm = "timesfm2p5_zero_shot"
checkpoint = "google/timesfm-2.5-200m-pytorch"
input_transform = "log1p"
max_context = 512
per_core_batch_size = 32
call_chunk_size = 256
model_parameters = 200000000

# These are the benchmark's required levels, not post-hoc intervals.
quantiles = [0.025, 0.1, 0.25, 0.5, 0.75, 0.9, 0.975]
