name: Run Data Pipeline and Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  run-and-test:

    name: Run Scripts and Tests

    runs-on: ubuntu-latest


    steps:

      # ------------------------------------
      # 1. Checkout Repository
      # ------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------
      # 2. Setup Python Environment
      # ------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ------------------------------------
      # 3. Display Environment Information
      # ------------------------------------
      - name: Check Python Version
        run: |
          python --version
          pip --version


      # ------------------------------------
      # 4. Install Dependencies
      # ------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-model.txt


      # ------------------------------------
      # 5. Create Required Directories
      # ------------------------------------
      - name: Prepare project directories
        run: |
          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p results
          mkdir -p models


      # ------------------------------------
      # 6. Run Data Processing Pipeline
      # ------------------------------------
      - name: Run Data Pipeline
        run: |

          echo "Loading dataset..."
          python scripts/data/0.load_dataset.py

          echo "Validating dataset..."
          python scripts/data/1.dataset_validate.py

          echo "Creating calendar features..."
          python scripts/data/2.create_calendar.py

          echo "Creating spatial nodes..."
          python scripts/data/3.create_nodes.py

          echo "Creating canonical dengue dataset..."
          python scripts/data/4.create_canonical_dengue.py


      # ------------------------------------
      # 7. Run Automated Tests
      # ------------------------------------
      - name: Run Tests
        run: |
          pytest tests/ -v


      # ------------------------------------
      # 8. Upload Results (Optional)
      # ------------------------------------
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            results/
            data/processed/