name: Run All scripts

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    run-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up python
              uses: actions/setup-python@v4
              with:
                  python-version: 3.12
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Run Scripts
              run: |
                python scripts/0.load_dataset.py
                python scripts/1.dataset_validate.py
                python scripts/2.create_nodes.py

            - name: Check tests
              run: |
                python -m pytest tests/
