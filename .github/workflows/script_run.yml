name: Refresh dengue data pipeline

on:
  # Reads a live external dataset and creates derived files: keep this opt-in
  # so pull-request checks remain reproducible and network-independent.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Refresh source data and validate it
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-model.txt

      - name: Show environment
        run: |
          python --version
          python -m pip --version

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh and validate dengue data
        run: |
          python scripts/data/0.load_dataset.py
          python scripts/data/1.dataset_validate.py
          python scripts/data/2.create_calendar.py
          python scripts/data/3.create_nodes.py
          python scripts/data/4.create_canonical_dengue.py

      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/
            data/interim/
